<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peninsula Engenharia | Gestão integrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#EDEDEB;--surface:#FFFFFF;--surface-2:#F6F6F4;--ink:#000000;--ink-2:#353535;--ink-3:#666666;
  --line:#D2D2CE;--line-2:#E6E6E3;--inv:#FFFFFF;--side-line:#000000;
  --serif:'Cormorant Garamond','Cormorant',Garamond,'Times New Roman',serif;
  --sans:'Jost','Futura','Century Gothic','Avenir Next',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000000;--surface:#0D0D0D;--surface-2:#151515;--ink:#FFFFFF;--ink-2:#D0D0D0;--ink-3:#959595;--line:#2E2E2E;--line-2:#1F1F1F;--inv:#000000;--side-line:#262626;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--surface:#0D0D0D;--surface-2:#151515;--ink:#FFFFFF;--ink-2:#D0D0D0;--ink-3:#959595;--line:#2E2E2E;--line-2:#1F1F1F;--inv:#000000;--side-line:#262626;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
#root{height:100%}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* logo */
.logo{display:flex;align-items:center;gap:14px;color:inherit}
.logo-ic{width:46px;height:auto;flex:none}
.logo-w{font-family:var(--serif);font-weight:500;font-size:23px;letter-spacing:.1em;text-transform:uppercase;line-height:1}
.logo.lg .logo-ic{width:58px}.logo.lg .logo-w{font-size:30px}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);height:100%}
.l-art{background:#000;color:#fff;display:flex;flex-direction:column;padding:44px 52px 40px;overflow:hidden;min-height:0}
.l-draw{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding:28px 0 22px}
.l-draw svg{height:100%;width:auto;max-height:600px}
.l-cap{font-size:12.5px;color:#8a8a8a;margin-bottom:22px}
.l-h{font-family:var(--serif);font-size:44px;line-height:1.05;font-weight:500;max-width:15ch}
.l-s{color:#9b9b9b;font-size:14.5px;margin-top:14px;max-width:48ch}
.l-form{background:var(--surface);overflow-y:auto;display:flex;justify-content:center;padding:56px 40px}
.l-in{width:100%;max-width:540px}
.l-in h1{font-family:var(--serif);font-weight:500;font-size:48px;line-height:1}
.l-in>p{color:var(--ink-3);margin-top:10px}
.l-in h4{font-size:13.5px;font-weight:500;margin:28px 0 10px}
.pg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pp{text-align:left;background:var(--surface);border:1px solid var(--line);padding:11px 14px 12px;cursor:pointer;display:block;width:100%}
.pp:hover{border-color:var(--ink-3)}
.pp b{display:block;font-weight:500;font-size:14px}
.pp span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.pp.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fld{display:block;margin-top:16px;font-size:13px;color:var(--ink-3)}
.fld input{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);font-size:14.5px;color:var(--ink)}
.fine{font-size:12.5px;color:var(--ink-3);margin-top:14px}
.creds{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-top:10px}

/* shell */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
.side{background:#000;color:#fff;display:flex;flex-direction:column;padding:30px 0 22px;overflow-y:auto;border-right:1px solid var(--side-line);z-index:30}
.side .logo{padding:0 26px 26px}
.me{display:flex;gap:12px;align-items:center;margin:0 20px 18px;padding:14px 6px;border-top:1px solid #262626;border-bottom:1px solid #262626}
.me b{display:block;font-weight:500;font-size:14px}
.me div span{display:block;font-size:12.5px;color:#9a9a9a;line-height:1.35}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:500;flex:none;background:#fff;color:#000;letter-spacing:.04em}
.av.ext{background:transparent;color:#fff;border:1px solid #fff}
.av.sm{width:30px;height:30px;font-size:11px;background:var(--ink);color:var(--inv)}
.av.sm.ext{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.nav-g{padding:6px 0 12px}
.nav-g h5{font-size:12px;font-weight:400;color:#7a7a7a;padding:0 26px 4px;margin:0}
.nl{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:#b3b3b3;padding:8px 26px;font-size:14.5px;cursor:pointer;position:relative}
.nl:hover{color:#fff}
.nl.on{color:#fff}
.nl.on::before{content:"";position:absolute;left:0;top:50%;width:14px;height:4px;background:#fff;transform:translateY(-50%)}
.nl .cnt{font-size:11.5px;border:1px solid #fff;border-radius:999px;padding:0 7px;color:#fff;line-height:18px}
.side :focus-visible{outline-color:#fff;outline-offset:-2px}
.side-foot{margin-top:auto;padding:16px 26px 0;border-top:1px solid #262626;font-size:12.5px;color:#7a7a7a;display:grid;gap:10px}
.side-foot button{background:none;border:1px solid #3a3a3a;color:#fff;padding:10px 12px;cursor:pointer;text-align:left;font-size:13.5px}
.side-foot button:hover{border-color:#fff}
.main{overflow-y:auto;min-width:0;height:100%}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:16px;padding:14px 40px;border-bottom:1px solid var(--line)}
.crumb{font-size:13.5px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:500}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.search{border:1px solid var(--line);background:var(--surface);padding:9px 12px;width:270px;font-size:13.5px;color:var(--ink)}
.search::placeholder{color:var(--ink-3)}
.ib{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative;color:var(--ink);flex:none}
.ib:hover{border-color:var(--ink)}
.ib svg{width:18px;height:18px}
.ib .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;background:var(--ink);border-radius:50%}
.menu{display:none}
.content{padding:36px 40px 88px;max-width:1500px}
.ph1{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.ph1 h1{font-family:var(--serif);font-weight:500;font-size:42px;line-height:1.05}
.ph1 p{color:var(--ink-3);margin-top:10px;max-width:72ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:25}
.scrim.on{opacity:1;pointer-events:auto}

/* building blocks */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:28px;background:var(--surface)}
.kpi{padding:16px 20px 18px;border-right:1px solid var(--line-2)}
.kpi:last-child{border-right:0}
.kpi-l{font-size:13px;color:var(--ink-3)}
.kpi-v{font-family:var(--serif);font-size:clamp(26px,2.3vw,34px);font-weight:500;line-height:1.1;margin-top:6px;white-space:nowrap}
.kpi-s{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.g{display:grid;gap:24px;margin-bottom:24px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.panel{background:var(--surface);border:1px solid var(--line);min-width:0}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line-2);min-height:56px}
.panel>header h3{font-size:15px;font-weight:500}
.pbody{padding:18px 20px}
.pbody.flush{padding:0}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:400;color:var(--ink-3);font-size:12.5px;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}
.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;white-space:nowrap}
.tbl td small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35;margin-top:2px}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.w5{font-weight:500}
.b{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;line-height:1;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;color:var(--ink);background:var(--surface)}
.b-risk{border-color:var(--ink);font-weight:500}
.sw{width:10px;height:10px;border:1px solid var(--ink);flex:none;display:inline-block}
.sw-solid{background:var(--ink)}
.sw-hatch{background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px)}
.sw-cross{background:repeating-linear-gradient(45deg,var(--ink) 0 1px,transparent 1px 3.5px),repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 3.5px)}
.sw-dot{background:radial-gradient(circle,var(--ink) .9px,transparent 1.2px) 0 0/4px 4px}
.sw-out{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.pbw{display:flex;align-items:center;gap:10px;min-width:140px}
.pbw span{font-size:13px;min-width:38px;text-align:right}
.pb{height:6px;background:var(--line-2);position:relative;flex:1;min-width:70px}
.pb i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.pb b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--inv);padding:11px 20px;font-size:14px;cursor:pointer;letter-spacing:.02em;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.82}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-sm{padding:7px 13px;font-size:13px}
.btn-block{width:100%;margin-top:22px;padding:14px}
.btns{display:inline-flex;gap:6px}
.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px}
.muted{color:var(--ink-3)}
.sm{font-size:13px}
.rows>div{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.rows>div:first-child{padding-top:0}
.rows>div:last-child{border-bottom:0;padding-bottom:0}
.rows small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:14px;margin:0}
.dl dt{color:var(--ink-3)}.dl dd{margin:0;text-align:right}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink)}
.inp:focus{border-color:var(--ink);outline:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-size:14px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--ink)}
.empty{padding:48px 24px;text-align:center}
.empty h4{font-family:var(--serif);font-size:26px;font-weight:500}
.empty p{color:var(--ink-3);margin-top:6px}
.note{border-left:2px solid var(--ink);padding:4px 0 4px 14px;font-size:13.5px;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line-2)}
.chart .ax{fill:var(--ink-3);font-size:11px;font-family:var(--sans)}
.chart .s1{fill:none;stroke:var(--ink);stroke-width:2}
.chart .s2{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 4}
.chart .today{stroke:var(--ink);stroke-dasharray:2 3}
.tw-svg{color:var(--ink);display:block}

/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(205px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border:1px solid var(--line-2);padding:12px;min-height:220px}
.kcol h4{display:flex;justify-content:space-between;font-size:13.5px;font-weight:500;margin:2px 4px 12px}
.kcol h4 span{color:var(--ink-3);font-weight:400}
.kc{background:var(--surface);border:1px solid var(--line);padding:12px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.4}
.kc b{font-weight:500;display:block}
.kc .meta{display:flex;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:12.5px;margin-top:8px}

/* drawer + toast */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--ink);z-index:41;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 26px) 28px calc(env(safe-area-inset-bottom,0px) + 32px)}
.drawer.on{transform:none}
.dscrim{z-index:40}
.dr-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:18px}
.drawer h2{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.1;padding-right:48px}
.drawer .sub{color:var(--ink-3);margin-top:6px}
.dsec{margin-top:24px;padding-top:18px;border-top:1px solid var(--line-2)}
.dsec h4{font-size:13.5px;font-weight:500;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,16px);background:var(--ink);color:var(--inv);padding:13px 20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);width:max-content}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* journey */
.jm{border-collapse:separate;border-spacing:4px;font-size:13px;width:100%;min-width:780px;table-layout:fixed}
.jm th.l{width:150px}
.jm th{font-weight:400;color:var(--ink-3);font-size:12px;text-align:center;padding:0 2px 6px;vertical-align:bottom;line-height:1.25}
.jm th.l,.jm td.l{text-align:left;white-space:nowrap;padding-right:14px;color:var(--ink)}
.jm th.sel{color:var(--ink);font-weight:500}
.jm td.c{height:24px;border:1px solid var(--ink);min-width:58px}
.jm td.d{background:var(--ink)}
.jm td.p{background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px)}
.jm td.f{border-color:var(--line)}
.steps{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin:4px 0 24px;background:var(--surface)}
.step{background:none;border:0;border-right:1px solid var(--line-2);text-align:left;padding:14px 12px 16px;cursor:pointer;color:var(--ink-3);display:flex;flex-direction:column;justify-content:flex-start}
.step:last-child{border-right:0}
.step .n{font-family:var(--serif);font-size:28px;line-height:1;display:block;color:var(--ink)}
.step .t{display:block;font-size:13px;margin-top:8px;line-height:1.3}
.step.on{background:var(--ink);color:var(--inv)}
.step.on .n{color:var(--inv)}
.ol{list-style:none;padding:0;margin:0;counter-reset:o}
.ol li{counter-increment:o;display:grid;grid-template-columns:28px 1fr;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.ol li:last-child{border-bottom:0}
.ol li::before{content:counter(o);font-family:var(--serif);font-size:18px;line-height:1.1;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);padding:5px 10px;font-size:13px;background:var(--surface)}
.ppl{display:grid;gap:10px}
.ppl>div{display:flex;gap:10px;align-items:center;font-size:14px}
.ppl small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.3}

/* LOB + building */
.lob{border-collapse:separate;border-spacing:3px;font-size:11.5px;width:100%;min-width:440px;table-layout:fixed}
.lob th{font-weight:400;color:var(--ink-3);padding:0 1px 6px;text-align:left;font-size:11px;line-height:1.2;vertical-align:bottom;overflow-wrap:anywhere}
.lob th:first-child{width:34px}
.lob td{height:13px;padding:0;border:1px solid var(--line)}
.lob td.f{border:0;color:var(--ink-3);text-align:right;padding-right:8px;width:34px;font-size:11px;line-height:1}
.lob td.d{background:var(--ink);border-color:var(--ink)}
.lob td.p{background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px);border-color:var(--ink)}
.bars>div{display:grid;grid-template-columns:150px 1fr 96px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.bars .trk{height:14px;position:relative;background:var(--line-2)}
.bars .trk i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bars .trk em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3)}
.bars .v{text-align:right;color:var(--ink-3);font-size:12.5px}

/* gantt */
.gt{min-width:900px;position:relative}
.gt-row{display:grid;grid-template-columns:240px 1fr;align-items:center;border-bottom:1px solid var(--line-2);min-height:46px}
.gt-l{font-size:13.5px;padding:8px 14px 8px 20px;line-height:1.3}
.gt-l small{display:block;color:var(--ink-3);font-size:12px}
.gt-t{position:relative;height:46px}
.gt-bar{position:absolute;top:16px;height:14px;border:1px solid var(--ink);background:var(--surface)}
.gt-bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.gt-bar.late{background:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 4px)}
.gt-head{border-bottom:1px solid var(--line)}
.gt-head .gt-t span{position:absolute;top:24px;font-size:12px;color:var(--ink-3);padding-left:6px;border-left:1px solid var(--line)}
.gt-today{position:absolute;top:0;bottom:0;border-left:1px dashed var(--ink);pointer-events:none}
.gt-today span{position:absolute;top:2px;left:6px;font-size:11.5px;background:var(--ink);color:var(--inv);padding:1px 6px;white-space:nowrap}

/* espelho */
.esp{display:grid;gap:4px;min-width:min(100%,420px)}
.esp-row{display:grid;grid-template-columns:40px repeat(var(--n),minmax(48px,1fr));gap:4px;align-items:center}
.esp-f{font-size:12px;color:var(--ink-3);text-align:right;padding-right:6px}
.u{height:30px;border:1px solid var(--ink);background:var(--surface);font-size:11.5px;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.u span{background:var(--surface);padding:0 3px;line-height:1.3}
.u.vendido{background:var(--ink);color:var(--inv)}
.u.vendido span{background:transparent}
.u.reservado{background:repeating-linear-gradient(135deg,var(--ink) 0 1px,var(--surface) 1px 5px)}

 else if(/aguard|pendente|análise|agendad|programad|a vencer|reserv|(^|\s)em (?!dia)|vence em|ressalva|elabora|parcial|falta|aberta|enviad/.test(s))k='hatch';
 else if(/aprovad|conclu|pago|paga|vendid|homolog|liberad|entregue|em dia|conectado|ativo|tratada|adquirido|conferido|no prazo|assinad|válid|confirmad|dentro|conforme/.test(s))k='solid';
 return badge(t,k)}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function tower(o){
 const W=o.w||100,H=o.h||200,pad=6,bw=W*(o.bw||.58),x0=(W-bw)/2,base=H-pad-(o.fund?10:0),fh=(base-pad-6)/o.f,bg=o.bg||'var(--surface-2)';

 s+=`<rect x="${x0+bw*.2}" y="${base-o.f*fh-5}" width="${bw*.6}" height="5" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="${o.d>=o.f?'0':'2 2'}"/>`;
 for(let i=1;i<=o.f;i++){const y=base-i*fh,k=i<=o.d?'d':(i===o.p?'p':'f');
  s+=`<rect x="${x0}" y="${y}" width="${bw}" height="${fh}" fill="${k==='d'?'currentColor':k==='p'?`url(#hp${o.id||''})`:'none'}" style="stroke:${k==='d'?bg:'currentColor'}" stroke-width="${k==='d'?.7:.6}" ${k==='f'?'stroke-dasharray="2 2" opacity=".6"':''}/>`;}
 if(o.hi){const y=base-o.hi*fh;s+=`<rect x="${x0-3}" y="${y-1}" width="${bw+6}" height="${fh+2}" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="${x0+bw+3}" x2="${W-2}" y1="${y+fh/2}" y2="${y+fh/2}" stroke="currentColor" stroke-width="1"/>`}
 if(o.fund){s+=`<rect x="${x0}" y="${base}" width="${bw}" height="10" fill="url(#hp${o.id||''})" stroke="currentColor" stroke-width=".6"/>`}
 s+=`<line x1="2" x2="${W-2}" y1="${base}" y2="${base}" stroke="currentColor" stroke-width="1"/></svg>`;return s}
function houses(){let s=`<svg viewBox="0 0 100 200" class="tw-svg" aria-hidden="true">`;
 for(let r=0;r<3;r++)for(let c=0;c<2;c++){const x=10+c*44,y=70+r*40;s+=`<path d="M${x} ${y+28}V${y+12}l18-12 18 12v16z" fill="none" stroke="currentColor" stroke-width=".7" stroke-dasharray="2 2" opacity=".7"/>`}

 const top=base-F*fh;s+=`<rect x="${x0+30}" y="${top-14}" width="${bw-60}" height="14" stroke-width=".6" stroke-dasharray="3 3" opacity=".45"/>`;
 // grua

 s+=`<line x1="200" x2="200" y1="${jy+8}" y2="${base-Pg*fh-40}" stroke-width=".6"/><path d="M196 ${base-Pg*fh-40} h8 v4 a4 4 0 0 1 -8 0z" stroke-width=".7"/><rect x="170" y="${base-Pg*fh-30}" width="60" height="6" fill="#fff"/>`;

 o.series.forEach(se=>{s+=`<polyline class="${se.c}" points="${se.d.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`});
 if(o.today!=null){const t=o.today,v=o.series[o.series.length-1].d[t];s+=`<line class="today" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H-B}"/><circle cx="${x(t)}" cy="${y(v)}" r="4" fill="var(--ink)"/><text class="ax" x="${x(t)+8}" y="${T+10}">Hoje</text>`}
 return s+'</svg>'}

 +`<div class="g g-21">${panel('COT-0931, Peninsula Maré',`<p class="sm muted" style="margin-bottom:14px">Concreto para blocos de coroamento e cortinas. Entregas entre dez/2026 e mar/2027 em Balneário Camboriú. Responda até 14/11/2026 às 18h.</p>`+table(['Item','>Quantidade','Preço unitário','>Total'],FCI.map(([n,u,q],i)=>`<tr><td class="w5">${n}</td><td class="r">${nf(q)} ${u}</td><td style="min-width:140px"><input class="inp" inputmode="decimal" placeholder="0,00" value="${S.cotq[i]||''}" oninput="S.cotq[${i}]=this.value;fTot()" aria-label="Preço unitário de ${n}"></td><td class="r" id="ft${i}">${brl(pn(S.cotq[i]||0)*q,2)}</td></tr>`)),'',false)}${panel('Condições',`<label class="fld" style="margin-top:0">Prazo de pagamento<select class="inp" style="margin-top:6px"><option>28 dias</option><option>30/60 dias</option><option>30/60/90 dias</option></select></label><label class="fld">Validade da proposta<select class="inp" style="margin-top:6px"><option>30 dias</option><option>60 dias</option><option>90 dias</option></select></label><div class="dsec"><dl class="dl"><dt class="w5" style="color:var(--ink)">Total da proposta</dt><dd id="fTot" style="font-family:var(--serif);font-size:28px">${brl(FCI.reduce((a,[,,q],i)=>a+pn(S.cotq[i]||0)*q,0),2)}</dd></dl><button class="btn btn-block" onclick="fSend()">Enviar proposta</button></div>`)}</div>`}
function fTot(){let t=0;FCI.forEach(([,,q],i)=>{const v=pn(S.cotq[i]||0)*q;t+=v;$('#ft'+i).textContent=brl(v,2)});$('#fTot').textContent=brl(t,2)}
function fSend(){const t=FCI.reduce((a,[,,q],i)=>a+pn(S.cotq[i]||0)*q,0);if(!t){toast('Preencha pelo menos um preço antes de enviar.');return}toast(`Proposta de ${brl(t,2)} enviada para Fernanda Lima.`)}

 +`<div style="height:24px"></div>`+panel('Permissões por perfil',table(['Perfil',...MODS],PERF.map((p,i)=>`<tr><td class="w5">${p}</td>${MODS.map((m,j)=>{const l=S.perm[i][j];return `<td class="lv"><button class="l${l}" onclick="cyc(${i},${j})" aria-label="${p}, ${m}: ${LV[l]}. Clique para mudar">${LV[l]}</button></td>`}).join('')}</tr>`),'pm')+`<div class="pbody" style="border-top:1px solid var(--line-2)"><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center"><span class="sm muted">Clique em uma célula para trocar o nível. Aprovar inclui editar, que inclui ver.</span><button class="btn btn-sm" onclick="toast('Permissões salvas. Valem no próximo acesso de cada pessoa.')">Salvar permissões</button></div></div>`,'',true)}
function cyc(i,j){S.perm[i][j]=(S.perm[i][j]+1)%4;render()}
const fmtU=(v,u)=>u==='%'?nf(v,1).replace(',0','')+'%':brl(v);
function chainHTML(){const F=S.flows[S.flow],v=F.sim,ch=[];F.fx.forEach(([a,q],i)=>{const from=i?F.fx[i-1][0]:0;if((i===0||v>from)&&!ch.includes(q))ch.push(q)});
 return `<div class="chain">${ch.map((x,i)=>`${i?'<i>depois</i>':''}<span class="chip">${x}</span>`).join('')}</div><p class="sm muted mt">${ch.length} ${ch.length===1?'aprovação':'aprovações'}. Prazo de resposta de ${F.sla} horas em cada etapa.</p>`}
function vFluxos(){const F=S.flows[S.flow];
 const fx=F.fx.map(([ate,q],i)=>{const from=i?F.fx[i-1][0]:0;return `<div class="flowr"><div>${ate==null?`<span class="sm">${i?'Acima de '+fmtU(from,F.u):'Qualquer valor'}</span>`:`<label class="sm muted" style="display:block;margin-bottom:4px">${i?'De '+fmtU(from,F.u)+' até':'Até'}</label><input class="inp" type="number" value="${ate}" onchange="setFx(${i},this.value)" aria-label="Limite da faixa ${i+1}">`}</div><div class="arr"></div><select class="inp" onchange="S.flows[S.flow].fx[${i}][1]=this.value;render()" aria-label="Quem aprova a faixa ${i+1}">${[...new Set([q,...ROLES])].map(r=>`<option${r===q?' selected':''}>${r}</option>`).join('')}</select>${ate!=null?`<button class="ib" onclick="delFx(${i})" aria-label="Remover faixa ${i+1}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`:'<span></span>'}</div>`}).join('');
 return head('Fluxos de aprovação','Defina quem aprova o quê, em que ordem e a partir de qual valor. É aqui que o sistema se ajusta ao jeito de trabalhar do seu time.',`<button class="btn btn-sm" onclick="toast('Fluxo de ${F.n.toLowerCase()} salvo. Vale para novas solicitações a partir de agora.')">Salvar fluxo</button>`)
 +`<div class="tabs">${Object.entries(S.flows).map(([k,f])=>`<button class="tab${k===S.flow?' on':''}" onclick="S.flow='${k}';render()">${f.n}</button>`).join('')}</div>`
 +`<div class="g g-21">${panel('Faixas de aprovação',fx+`<div class="mt"><button class="btn btn-ghost btn-sm" onclick="addFx()">Adicionar faixa</button></div><p class="note mt">A aprovação é em cadeia: uma solicitação passa por todas as faixas até chegar à sua.</p>`)}${panel('Simular uma solicitação',`<label class="fld" style="margin-top:0">Valor ${F.u==='%'?'do desconto, em %':'da solicitação, em R$'}<input class="inp" type="number" value="${F.sim}" oninput="S.flows[S.flow].sim=+this.value;$('#simOut').innerHTML=chainHTML()" style="margin-top:6px"></label><div class="dsec"><h4>Quem precisa aprovar</h4><div id="simOut">${chainHTML()}</div></div>`)}</div>`
 +`<div class="g g-2">${panel('Regras adicionais',F.op.map(([t,on],i)=>`<div class="tg" role="switch" tabindex="0" aria-checked="${!!on}" onclick="tglOp(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tglOp(${i})}"><span>${t}</span><span class="sw-t${on?' on':''}"></span></div>`).join(''))}${panel('Prazo de resposta',`<label class="fld" style="margin-top:0">Horas para cada aprovador responder<input class="inp" type="number" min="1" value="${F.sla}" onchange="S.flows[S.flow].sla=+this.value;render()" style="margin-top:6px"></label><p class="sm muted mt">Passado o prazo, o sistema avisa o aprovador de novo e, depois de mais ${F.sla} horas, avisa o gestor dele.</p>`)}</div>`}
function setFx(i,v){const F=S.flows[S.flow];F.fx[i][0]=Math.max(0,+v);render()}
function addFx(){const F=S.flows[S.flow],l=F.fx.length-1,p=l>0?F.fx[l-1][0]:0;F.fx.splice(l,0,[p?p*2:(F.u==='%'?2:20000),'Gerente de obras']);render()}
function delFx(i){S.flows[S.flow].fx.splice(i,1);render()}
function tglOp(i){const o=S.flows[S.flow].op[i];o[1]=o[1]?0:1;render()}
function vAudit(){
 return head('Auditoria','Tudo o que foi feito no sistema, por quem e quando. Os registros não podem ser apagados nem editados.')

function viaCalc(){const v=S.via,ap=21400,ac=34000,vgv=ap*v.preco/1e6,perm=vgv*v.perm/100,rec=vgv-perm,obra=ac*v.custo/1e6,imp=rec*.04,com=rec*.06,desp=rec*.05,res=rec-obra-imp-com-desp;return {vgv,perm,rec,obra,imp,com,desp,res,mg:res/rec*100}}
function viaOut(){const r=viaCalc(),seg=[['Permuta',r.perm,'dot'],['Obra',r.obra,'solid'],['Impostos, comercial e despesas',r.imp+r.com+r.desp,'hatch'],['Resultado',Math.max(r.res,0),'out']];
 return `<div class="stack">${seg.map(([n,x,c])=>`<span class="sw-${c}" style="width:${x/r.vgv*100}%;border-right:1px solid var(--ink)" title="${n}"></span>`).join('')}</div>${legend(seg.map(([n,x,c])=>[c,n+': '+mi(x)]))}<dl class="dl mt2"><dt>VGV</dt><dd>${mi(r.vgv)}</dd><dt>Receita sem a permuta</dt><dd>${mi(r.rec)}</dd><dt>Custo de obra</dt><dd>${mi(r.obra)}</dd><dt>Impostos (RET de 4%)</dt><dd>${mi(r.imp)}</dd><dt>Comercial (6%)</dt><dd>${mi(r.com)}</dd><dt>Projetos, aprovação e marketing (5%)</dt><dd>${mi(r.desp)}</dd><dt class="w5" style="color:var(--ink)">Resultado</dt><dd class="w5">${mi(r.res)}</dd><dt class="w5" style="color:var(--ink)">Margem sobre a receita</dt><dd style="font-family:var(--serif);font-size:30px;line-height:1">${nf(r.mg,1)}%</dd></dl><div class="mt">${r.mg>=28?st('Dentro da meta do comitê, 28%'):st('Abaixo da meta do comitê, 28%')}</div>`}
const VL={preco:v=>brl(v)+'/m²',custo:v=>brl(v)+'/m²',perm:v=>v+'%'};
function setVia(k,v){S.via[k]=+v;$('#lv-'+k).textContent=VL[k](+v);$('#viaOut').innerHTML=viaOut()}
function vTerrenos(){const ET=['Prospecção','Viabilidade','Due diligence','Comitê','Adquirido'];
 const rg=(k,l,min,max,step)=>`<div class="rng"><label for="r-${k}">${l} <b id="lv-${k}">${VL[k](S.via[k])}</b></label><input id="r-${k}" type="range" min="${min}" max="${max}" step="${step}" value="${S.via[k]}" oninput="setVia('${k}',this.value)"></div>`;
 return head('Terrenos e viabilidade','Funil de áreas em estudo e simulação do negócio antes de levar ao comitê de investimento.',`<button class="btn btn-sm" onclick="toast('Terreno cadastrado na etapa de prospecção.')">Cadastrar terreno</button>`)
 +kpis([['Terrenos em estudo','5','VGV potencial de R$ 1,56 bi'],['No comitê','1','Savassi, decisão em 17/11'],['Banco de terrenos','R$ 1,87 bi','em VGV já garantido'],['Margem mínima','28%','definida pelo comitê']])
 +`<div class="kb" style="margin-bottom:24px">${ET.map(e=>{const ts=TER.filter(t=>t.et===e);return `<div class="kcol"><h4>${e} <span>${ts.length}</span></h4>${ts.map(t=>`<div class="kc"${t.n==='Ecoville'?' style="border-color:var(--ink)"':''}><b>${t.n}</b>${t.loc}, ${t.area}<div class="meta"><span>${t.neg}</span></div>${t.vgv?`<div class="meta"><span>VGV estimado</span><span>${mi(t.vgv)}</span></div>`:''}</div>`).join('')}</div>`}).join('')}</div>`
 +`<div class="g g-12">${panel('Simulação do terreno Ecoville',`<p class="sm muted" style="margin-bottom:18px">Curitiba/PR. 4.200 m² de terreno, 21.400 m² de área privativa e 34.000 m² de área construída. Mova os controles para testar cenários.</p>${rg('preco','Preço médio de venda',18000,32000,100)}${rg('custo','Custo de obra por m² construído',5500,9500,50)}${rg('perm','Permuta com o dono do terreno',0,30,1)}`)}${panel('Resultado do estudo',`<div id="viaOut">${viaOut()}</div>`)}</div>`}

function genUnits(){const cfg={aurora:{seed:7,pv:.78,pr:.05,pp:.05,areas:[186,186,242,242],m2:21800},mare:{seed:11,pv:.41,pr:.05,pp:.04,areas:[312,286],m2:38500},vertice:{seed:3,pv:.91,pr:.03,pp:.02,areas:[92,104,118,96,92,104,118,96],m2:26000}};
 const NM=['Família Arruda','Carolina Prates','Marcelo Dantas','Helena e Otávio Cruz','Juliano Reis','Sofia Albuquerque','Tiago Monteiro','Ana Paula Cerqueira','Felipe Guimarães','Laura Bastos','Gustavo e Íris Leme','Patrícia Sampaio'];
 for(const [k,c] of Object.entries(cfg)){const r=rng(c.seed),E=ECFG[k];S.units[k]={};for(let f=1;f<=E.f;f++)for(let j=0;j<E.u;j++){const id=f*100+j+1,x=r(),s=x<c.pv?'vendido':x<c.pv+c.pr?'reservado':x<c.pv+c.pr+c.pp?'permuta':'disponivel',area=c.areas[j];S.units[k][id]={s,area,preco:Math.round(area*c.m2*(1+.006*(f-1))/1000)*1000,cli:s==='vendido'?NM[Math.floor(r()*NM.length)]:s==='reservado'?'Cliente em negociação':null}}}
 const a=S.units.aurora;Object.assign(a[1802],{s:'vendido',cli:'Beatriz Montenegro'});Object.assign(a[2401],{s:'reservado',cli:'Eduarda Fontes'});Object.assign(a[1503],{s:'reservado',cli:'Luísa Peixoto'});Object.assign(a[2202],{s:'vendido',cli:'Eduardo e Marina Falcão'});Object.assign(a[1404],{s:'vendido',cli:'Renata Vilela'})}
genUnits();
for(const k of ['aurora','mare','vertice']){const u=Object.values(S.units[k]);EMP.find(e=>e.id===k).vend=Math.round(u.filter(x=>x.s==='vendido').length/u.length*100)}
render();
